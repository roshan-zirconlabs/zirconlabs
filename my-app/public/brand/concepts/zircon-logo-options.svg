<svg width="1600" height="980" viewBox="0 0 1600 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Zircon Labs logo directions</title>
  <rect width="1600" height="980" fill="#FBFAFF"/>
  <text x="90" y="102" fill="#0F172A" font-family="DM Sans, Arial, sans-serif" font-size="52" font-weight="700">Zircon Labs — logo directions</text>
  <text x="90" y="150" fill="#64748B" font-family="DM Sans, Arial, sans-serif" font-size="25">Built for a calm, technical prediction-market product—not a generic crypto badge.</text>
  <g transform="translate(90 220)"><rect width="315" height="520" rx="32" fill="white" stroke="#EDE9FE" stroke-width="3"/><image href="01-monoline-z.svg" x="43" y="42" width="229" height="229"/><text x="42" y="335" fill="#0F172A" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="700">01 / Monoline Z</text><text x="42" y="379" fill="#64748B" font-family="DM Sans, Arial, sans-serif" font-size="21">Minimal, premium, fast.</text><text x="42" y="415" fill="#64748B" font-family="DM Sans, Arial, sans-serif" font-size="21">Best for navbar + favicon.</text></g>
  <g transform="translate(450 220)"><rect width="315" height="520" rx="32" fill="white" stroke="#EDE9FE" stroke-width="3"/><image href="02-probability-fork.svg" x="43" y="42" width="229" height="229"/><text x="42" y="335" fill="#0F172A" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="700">02 / Outcome Fork</text><text x="42" y="379" fill="#64748B" font-family="DM Sans, Arial, sans-serif" font-size="21">Expresses prediction paths.</text><text x="42" y="415" fill="#64748B" font-family="DM Sans, Arial, sans-serif" font-size="21">Most product-explanatory.</text></g>
  <g transform="translate(810 220)"><rect width="315" height="520" rx="32" fill="white" stroke="#EDE9FE" stroke-width="3"/><image href="03-signal-orbit.svg" x="43" y="42" width="229" height="229"/><text x="42" y="335" fill="#0F172A" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="700">03 / Signal Orbit</text><text x="42" y="379" fill="#64748B" font-family="DM Sans, Arial, sans-serif" font-size="21">Feels dynamic and live.</text><text x="42" y="415" fill="#64748B" font-family="DM Sans, Arial, sans-serif" font-size="21">Strong for motion assets.</text></g>
  <g transform="translate(1170 220)"><rect width="315" height="520" rx="32" fill="white" stroke="#EDE9FE" stroke-width="3"/><image href="04-prism-execution.svg" x="43" y="42" width="229" height="229"/><text x="42" y="335" fill="#0F172A" font-family="DM Sans, Arial, sans-serif" font-size="31" font-weight="700">04 / Prism</text><text x="42" y="379" fill="#64748B" font-family="DM Sans, Arial, sans-serif" font-size="21">Bold, structured, ownable.</text><text x="42" y="415" fill="#64748B" font-family="DM Sans, Arial, sans-serif" font-size="21">Strongest app-icon presence.</text></g>
  <text x="90" y="858" fill="#7C3AED" font-family="DM Mono, monospace" font-size="22" font-weight="700" letter-spacing="3">CHOOSE A DIRECTION, THEN WE’LL REFINISH IT AS THE FINAL SYSTEM</text>
</svg>
