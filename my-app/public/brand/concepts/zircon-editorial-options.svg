<svg width="1600" height="1020" viewBox="0 0 1600 1020" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Zircon Labs modern editorial logo directions</title>
  <rect width="1600" height="1020" fill="#F4F0E6"/>
  <rect x="90" y="74" width="16" height="96" fill="#FF4D2E"/>
  <text x="136" y="119" fill="#141414" font-family="Georgia, Times New Roman, serif" font-size="64" font-weight="700">Zircon Labs</text>
  <text x="139" y="164" fill="#2855FF" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="5">MODERN EDITORIAL DIRECTIONS</text>
  <g transform="translate(90 242)"><rect width="450" height="560" fill="#FFFDF8" stroke="#141414" stroke-width="3"/><image href="editorial-01-masthead-z.svg" x="62" y="44" width="326" height="326"/><text x="44" y="439" fill="#141414" font-family="Arial, sans-serif" font-size="31" font-weight="700">01 / MASTHEAD Z</text><text x="44" y="485" fill="#4B5563" font-family="Arial, sans-serif" font-size="23">Classic, assertive, financial-journal feel.</text></g>
  <g transform="translate(575 242)"><rect width="450" height="560" fill="#FFFDF8" stroke="#141414" stroke-width="3"/><image href="editorial-02-cut-z.svg" x="62" y="44" width="326" height="326"/><text x="44" y="439" fill="#141414" font-family="Arial, sans-serif" font-size="31" font-weight="700">02 / CUT Z</text><text x="44" y="485" fill="#4B5563" font-family="Arial, sans-serif" font-size="23">The strongest compact product mark.</text></g>
  <g transform="translate(1060 242)"><rect width="450" height="560" fill="#FFFDF8" stroke="#141414" stroke-width="3"/><image href="editorial-03-index.svg" x="62" y="44" width="326" height="326"/><text x="44" y="439" fill="#141414" font-family="Arial, sans-serif" font-size="31" font-weight="700">03 / INDEX</text><text x="44" y="485" fill="#4B5563" font-family="Arial, sans-serif" font-size="23">Bolder, more youthful, more consumer.</text></g>
  <g transform="translate(90 851)"><rect width="1420" height="105" fill="#141414"/><text x="42" y="52" fill="#F4F0E6" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="5">04 / WORDMARK SYSTEM</text><text x="448" y="64" fill="#F4F0E6" font-family="Georgia, Times New Roman, serif" font-size="48" font-weight="700">Zircon</text><path d="M444 80H670" stroke="#2855FF" stroke-width="8"/><circle cx="754" cy="57" r="22" fill="#FF4D2E"/></g>
</svg>
