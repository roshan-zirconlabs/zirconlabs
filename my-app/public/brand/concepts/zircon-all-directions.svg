<svg width="1840" height="1320" viewBox="0 0 1840 1320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Zircon Labs — all brand directions</title><rect width="1840" height="1320" fill="#F8FAFC"/>
  <text x="80" y="100" fill="#0F172A" font-family="Arial, sans-serif" font-size="56" font-weight="700">Zircon Labs — eight brand directions</text><text x="80" y="146" fill="#64748B" font-family="Arial, sans-serif" font-size="25">Compare personality first. We will refine one direction into the actual logo system.</text>
  <text x="80" y="218" fill="#1E5C45" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">01 / PREMIUM FINANCE</text>
  <g transform="translate(80 250)"><image href="finance-01-ledger-z.svg" width="280" height="280"/><text y="320" fill="#17251E" font-family="Arial, sans-serif" font-size="27" font-weight="700">Ledger Z</text></g><g transform="translate(400 250)"><image href="finance-02-seal.svg" width="280" height="280"/><text y="320" fill="#17251E" font-family="Arial, sans-serif" font-size="27" font-weight="700">Market Seal</text></g>
  <text x="760" y="218" fill="#2855FF" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">02 / MODERN EDITORIAL</text>
  <g transform="translate(760 250)"><image href="editorial-01-masthead-z.svg" width="280" height="280"/><text y="320" fill="#141414" font-family="Arial, sans-serif" font-size="27" font-weight="700">Masthead Z</text></g><g transform="translate(1080 250)"><image href="editorial-02-cut-z.svg" width="280" height="280"/><text y="320" fill="#141414" font-family="Arial, sans-serif" font-size="27" font-weight="700">Cut Z</text></g>
  <text x="80" y="690" fill="#2563EB" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">03 / CLEAN TRADING UTILITY</text>
  <g transform="translate(80 720)"><image href="utility-01-tick.svg" width="280" height="280"/><text y="320" fill="#0F172A" font-family="Arial, sans-serif" font-size="27" font-weight="700">Market Tick</text></g><g transform="translate(400 720)"><image href="utility-02-grid.svg" width="280" height="280"/><text y="320" fill="#0F172A" font-family="Arial, sans-serif" font-size="27" font-weight="700">Execution Grid</text></g>
  <text x="760" y="690" fill="#0E7490" font-family="Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="4">04 / PLAYFUL CONSUMER APP</text>
  <g transform="translate(760 720)"><image href="playful-01-loop.svg" width="280" height="280"/><text y="320" fill="#172554" font-family="Arial, sans-serif" font-size="27" font-weight="700">Friendly Loop</text></g><g transform="translate(1080 720)"><image href="playful-02-blocks.svg" width="280" height="280"/><text y="320" fill="#172554" font-family="Arial, sans-serif" font-size="27" font-weight="700">Friendly Blocks</text></g>
  <rect x="80" y="1135" width="1680" height="95" rx="20" fill="#0F172A"/><text x="120" y="1194" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="26" font-weight="700">Pick a family first — finance, editorial, utility, or consumer — then we will remove what does not belong and finish one ownable mark.</text>
</svg>
